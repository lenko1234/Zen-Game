<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Nave Zen</title>
    <!-- Use una fuente elegante y amigable con la ciencia ficción -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="game-container" id="game-container">
        
        <!-- NUEVA CAPA DE RESPLANDOR -->
        <div class="breathing-overlay" id="breathing-overlay"></div>

        <!-- BARRA DE UI MODIFICADA -->
        <div class="info-bar">
            <span id="score-display">0</span>
            <div id="lives-display">
                <!-- Los corazones se generan por JS -->
            </div> 
        </div>

        <canvas id="gameCanvas"></canvas>

        <div id="message-box" class="visible">
            <h2 style="position: relative; z-index: 1;">Nave Zen</h2>
            
            <p class="zen-benefit" style="position: relative; z-index: 1;">
                Este juego es un ejercicio de respiración diseñado para calmar tu sistema nervioso.
            </p>
            
            <p style="margin-top: 15px; margin-bottom: 20px; font-size: 1.1rem; color: #00ffaa; position: relative; z-index: 1;">
                Sigue el ritmo y relaja tu mente.
            </p>
            
            <button id="start-button" style="position: relative; z-index: 1;">Iniciar Juego</button>
            <button id="benefits-button" style="margin-top: 10px; padding: 8px 16px; font-size: 0.9rem; background: rgba(0, 255, 170, 0.2); border: 1px solid #00ffaa; position: relative; z-index: 1;">Ver Beneficios</button>
        </div>
    </div>
    
    <!-- Controles Ocultos -->
    <div class="mobile-controls-wrapper">
        <button class="control-button" id="left-btn"> &lt; </button>
        <button class="fire-button" id="fire-btn">DISPARAR</button>
        <button class="control-button" id="right-btn"> &gt; </button>
    </div>
    
    <script type="module" src="game.js"></script>
</body>
</html>
